server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: testhub
  profiles:
    active: h2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

testhub:
  jwt:
    secret: testhub-secret-key-for-course-project-2026-please-change-in-production
    expire-minutes: 720
  api-runner:
    connect-timeout: 10
    read-timeout: 30
    max-response-length: 20000

logging:
  level:
    com.testhub: info
